version: '3.8'

networks:
  vedaai-network:
    driver: bridge

volumes:
  mongodb_data:
  redis_data:

services:
  # 1. Database Layer: MongoDB
  mongodb:
    image: mongo:8.0
    container_name: vedaai-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    networks:
      - vedaai-network
    volumes:
      - mongodb_data:/data/db

  # 2. Cache & Queue Layer: Redis
  redis:
    image: redis:7-alpine
    container_name: vedaai-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    networks:
      - vedaai-network
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  # 3. Application Layer: Express.js Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development # Targets development stages if multi-stage Dockerfile is used
    container_name: vedaai-backend
    restart: unless-stopped
    ports:
      - '5000:5000' # Modify this if your Express server runs on a different port
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/vedaai
      - REDIS_URL=redis://redis:6379
      - GOOGLE_API_KEY=AQ.Ab8RN6Jgf93N8pzTvV1U36kpVwL3iBvt8hf527XFfvwPWfFZmg
      - CORS_ORIGIN=http://localhost:3000
    volumes:
      - ./backend:/app
      - /app/node_modules # Prevents local host node_modules overriding container node_modules
    networks:
      - vedaai-network
    depends_on:
      mongodb:
        condition: service_started
      redis:
        condition: service_started

  # 4. User Interface Layer: Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vedaai-frontend
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:5000 # Direct browser calls to backend host mapping
      - NEXT_PUBLIC_SOCKET_URL=http://localhost:5000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next # Cache Next.js build outputs effectively inside container
    networks:
      - vedaai-network
    depends_on:
      - backend